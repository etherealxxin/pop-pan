<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pop Pan</title>
<meta name="theme-color" content="#ed743c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ed743c'/%3E%3Cpath transform='translate(6 6) scale(1.4)' d='M6.43.42c.3-.55 1.1-.55 1.4 0l2.02 3.68c.07.14.18.25.32.32l3.68 2.01c.55.3.55 1.1 0 1.4L10.17 9.85a.8.8 0 0 0-.32.32l-2.01 3.68c-.3.55-1.1.55-1.4 0L4.42 10.17a.8.8 0 0 0-.32-.32L.42 7.83c-.55-.3-.55-1.1 0-1.4L4.1 4.42a.8.8 0 0 0 .32-.32z' fill='%23f9ffca'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css" rel="stylesheet">
<style>
:root{
  --bg:#ed743c;
  --cream:#f9ffca;
  --ink:#23007d;
  --green:#2ae420;
  --red:#ff616b;
  --pink:#e254ff;
  --track:rgba(0,51,179,.1);
  --rim:#93dbff;
  --pan:#23007d;
  --handle:#efefef;
  --glow:#f34d00;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --soft:cubic-bezier(.22,1,.36,1);
  --display:'Bowlby One',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:'SUIT',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
img{-webkit-user-drag:none;user-drag:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none}

/* ---------- display type ---------- */
.display{font-family:var(--display);font-weight:400}

/* ---------- field ---------- */
#field{position:absolute;inset:0;transition:filter .5s var(--soft),transform .5s var(--soft)}
#app.result #field{filter:blur(4px);transform:scale(.985)}

#flames{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.flame{position:absolute;left:-20px;top:-20px;width:40px;height:40px}
.flame i{display:block;width:40px;height:40px;background:var(--ember) center/contain no-repeat;
  transform:scale(0);transform-origin:50% 75%;opacity:0;
  transition:transform .45s var(--spring),opacity .3s ease;filter:drop-shadow(0 0 6px rgba(255,214,70,.55))}
#flames.on .flame i{transform:scale(1);opacity:1;animation:flicker .9s ease-in-out infinite alternate}
@keyframes flicker{
  0%{transform:scale(1,1)}
  40%{transform:scale(.94,1.1)}
  100%{transform:scale(1.04,.9)}
}

#pan{position:absolute;left:0;top:0;width:270px;height:371px;transform-origin:135px 135px;will-change:transform}
.neck,.ps-neck{position:absolute;left:0;top:0;width:270px;height:371px;overflow:visible;pointer-events:none}
.neck path,.ps-neck path{fill:var(--rim)}
.ps-neck{filter:drop-shadow(0 20px 20px rgba(243,77,0,.5))}
.grip,.ps-grip{position:absolute;left:117px;top:281px;width:36px;height:90px;border-radius:10px 10px 16px 16px;background:var(--handle)}
.rim,.ps-rim{position:absolute;left:1px;top:1px;width:268px;height:268px;border-radius:50%;background:var(--rim)}
.ps-grip,.ps-rim{box-shadow:0 20px 40px rgba(243,77,0,.5)}
.inner{position:absolute;left:27px;top:27px;width:216px;height:216px;border-radius:50%;z-index:0;--heat:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,97,107,calc(.75 * var(--heat))) 0%,rgba(226,40,90,calc(.45 * var(--heat))) 45%,rgba(35,0,125,0) 75%),var(--pan)}
#items{z-index:1}
#items{position:absolute;left:0;top:0;width:270px;height:270px}
.item{position:absolute;left:0;top:0;will-change:transform}
.item.popped{z-index:1}   /* popcorn rests on top of unpopped kernels */
.item img{display:block;width:100%;height:100%;pointer-events:none}
.kernel{width:18px;height:18px}
.kernel.in img{animation:dropIn .5s var(--spring) both}
@keyframes dropIn{from{opacity:0;transform:translateY(-14px) scale(.4)}to{opacity:1;transform:none}}
.pc{position:relative;width:100%;height:100%}
.pc img{position:absolute;inset:0}
.pc .b{opacity:var(--burn,0)}
.pc.pop{animation:popIn .42s var(--spring) both}
@keyframes popIn{0%{transform:scale(.25) rotate(-20deg)}60%{transform:scale(1.18) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.puff{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid rgba(255,254,250,.9);animation:puff .45s var(--soft) forwards;pointer-events:none}
@keyframes puff{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.item.spill{transition:opacity .7s ease}

/* ---------- HUD ---------- */
.card{position:relative;background:var(--cream);border-radius:28px;box-shadow:inset 0 1px 8px rgba(255,255,255,.4)}
#hud{position:absolute;left:0;right:0;top:0;pointer-events:none;transition:opacity .3s ease;filter:drop-shadow(0 20px 20px var(--glow))}
#topbar{position:absolute;top:calc(20px + env(safe-area-inset-top));left:50%;height:54px;width:80px;transform:translate(-50%,-140%);
  display:flex;align-items:center;justify-content:center;padding:0 16px;pointer-events:auto;
  transition:width .6s var(--spring),transform .6s var(--spring)}
#app.ready #topbar,#app.playing #topbar,#app.result #topbar{transform:translate(-50%,0)}
#app.playing #topbar,#app.result #topbar{width:calc(100% - 40px)}
#app.ready #topbar{cursor:pointer}
@media (hover:hover){#app.playing #field{cursor:grab}#app.playing.dragging #field{cursor:grabbing}}
#app.ready #topbar:active{transform:translate(-50%,0) scale(.94)}
.lv{display:flex;align-items:center;gap:2px;font-weight:900;font-size:16px;line-height:18px;letter-spacing:-.32px;white-space:nowrap}
.lv svg{width:16px;height:16px;padding:.87px;transition:transform .5s var(--spring)}
#app.ready .lv svg{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(90deg) scale(1.15)}}
.lv.spin svg{animation:spin .5s var(--spring)!important}
@keyframes spin{from{transform:rotate(-180deg) scale(.5)}to{transform:rotate(0) scale(1)}}
#count{position:absolute;right:16px;font-variant-numeric:tabular-nums;top:50%;transform:translateY(-50%);font-weight:500;font-size:14px;line-height:18px;letter-spacing:-.28px;opacity:0;transition:opacity .3s ease .2s;white-space:nowrap}
#app.playing #count,#app.result #count{opacity:.8}
#app.playing .lv,#app.result .lv{margin-right:auto}

#stats{position:absolute;left:calc(20px + env(safe-area-inset-left));right:calc(20px + env(safe-area-inset-right));top:calc(94px + env(safe-area-inset-top));display:flex;gap:10px}
.stat{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 16px 20px;text-align:center;
  opacity:0;transform:translateY(-24px) scale(.92);transition:transform .55s var(--spring),opacity .35s ease}
#app.ready .stat,#app.playing .stat,#app.result .stat{opacity:1;transform:none}
.stat:nth-child(2){transition-delay:.06s}
.stat:nth-child(3){transition-delay:.12s}
.stat .k{font-weight:500;font-size:14px;line-height:18px;letter-spacing:-.28px;opacity:.8;width:100%}
.stat .v{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;line-height:18px;letter-spacing:-.32px;width:100%;white-space:nowrap;display:inline-block}
.bar{position:relative;width:100%;height:12px;margin-top:6px;border-radius:8px;background:var(--track);overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);transition:transform .14s linear;border-radius:0}
.bar.heat i{background:var(--red)}
.bar.shake i{background:var(--green)}
.bar.burn i{background:var(--pink)}
.bar b{position:absolute;top:2px;bottom:2px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px;opacity:.45;transition:left .4s var(--soft)}
.stat.alarm{animation:wobble .5s ease-in-out infinite}
@keyframes wobble{0%,100%{rotate:0deg}25%{rotate:-2.5deg}75%{rotate:2.5deg}}

/* ---------- bottom ---------- */
#timer{position:absolute;left:calc(20px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));min-width:62px;text-align:center;font-variant-numeric:tabular-nums;padding:16px;border-radius:28px;background:rgba(255,255,255,.4);box-shadow:inset 0 1px 8px rgba(255,255,255,.4);
  font-weight:900;font-size:16px;line-height:18px;letter-spacing:-.32px;white-space:nowrap;
  opacity:0;transform:translateY(30px);transition:transform .55s var(--spring),opacity .3s ease,background-color .3s ease,color .3s ease}
#app.ready #timer,#app.playing #timer,#app.result #timer{opacity:1;transform:none}
#timer.urgent{background:var(--red);color:var(--cream)}
#sound{position:absolute;right:calc(20px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:50px;height:50px;border-radius:28px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.4);box-shadow:inset 0 1px 8px rgba(255,255,255,.4);color:var(--ink);transition:transform .25s var(--spring)}
#sound.hide{opacity:0;visibility:hidden;transform:translateY(30px)}
#sound{transition:transform .55s var(--spring),opacity .3s ease}
#sound:active{transform:scale(.9)}
#sound:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#sound svg{width:22px;height:22px}
#sound .x{display:none}
#sound.off .x{display:inline}
#sound.off .w{display:none}

/* same size and spot as the title's "Tap to start" */
#msg{position:absolute;left:0;right:0;bottom:calc(35px + env(safe-area-inset-bottom));line-height:20px;text-align:center;pointer-events:none}
#msg span{color:#fff;font-weight:900;font-size:16px;letter-spacing:-.32px;white-space:nowrap}
#msg span.out{visibility:hidden}

/* ---------- title ---------- */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:opacity .45s ease}
#title h1{font-family:'Bowlby One',sans-serif;font-weight:400;color:var(--cream);font-size:min(180px,50vw);line-height:1;white-space:nowrap;text-align:center;margin-top:0;
  transition:transform .55s var(--soft),opacity .4s ease}
#title h1 .w{display:block}
#title h1 .c{display:inline-block;animation:letterIn .7s var(--spring) both}
#app.fontwait #title h1 .c{animation-play-state:paused}
@keyframes letterIn{0%{opacity:0;transform:translateY(-60px) rotate(-8deg) scale(.7)}100%{opacity:1;transform:none}}
#hint{position:absolute;left:0;right:0;bottom:calc(35px + env(safe-area-inset-bottom));line-height:20px;text-align:center;color:#fff;font-weight:900;font-size:16px;letter-spacing:-.32px}
#app.away #title{opacity:0;pointer-events:none}
#app.away #title h1{transform:translateY(-40px) scale(1.08);opacity:0}
#app:not(.title) #title{display:none}
#app.title:not(.away) #items{visibility:hidden}
#app.title #hud{opacity:0}

@media (min-aspect-ratio:1/1){
  #title h1{font-size:min(150px,14vw,22vh);margin-top:max(64px,12vh)}
  #title h1 .w{display:inline}
  #title h1 .w+.w{margin-left:.32em}
  #stats{left:calc(17px + env(safe-area-inset-left));right:calc(17px + env(safe-area-inset-right));top:calc(81px + env(safe-area-inset-top))}
  #topbar{top:calc(16px + env(safe-area-inset-top));height:46px}
  #app.playing #topbar,#app.result #topbar{width:calc(100% - 34px)}
  .stat{padding:12px 14px 16px}
}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;filter:drop-shadow(0 20px 20px var(--glow))}
#card{width:min(320px,calc(100% - 40px));min-height:220px;padding:16px 16px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  opacity:0;transform:scale(.7) translateY(30px);transition:transform .55s var(--spring),opacity .25s ease}
#app.showmodal #modal{pointer-events:auto}
#app.showmodal #card{opacity:1;transform:none}
#rtitle{font-size:48px;line-height:52px;white-space:nowrap;text-align:center;max-width:100%}
#stars{display:flex;gap:6px;height:22px;align-items:center}
#stars:empty{display:none}
#stars svg{width:22px;height:22px;transform:scale(0)}
#stars svg.off path{fill:var(--track)}
#app.showmodal #stars svg{animation:starIn .5s var(--spring) both}
@keyframes starIn{0%{transform:scale(0) rotate(-120deg)}100%{transform:scale(1) rotate(0)}}
#rbtn{background:var(--green);padding:16px;border-radius:28px;font-weight:700;font-size:16px;line-height:18px;letter-spacing:-.32px;color:var(--ink);white-space:nowrap;
  transition:transform .25s var(--spring),box-shadow .25s ease}
#app.showmodal #rbtn{animation:btnIn .5s var(--spring) .25s both}
@keyframes btnIn{0%{opacity:0;transform:translateY(10px) scale(.8)}100%{opacity:1;transform:none}}
@media (hover:hover){#rbtn:hover{transform:scale(1.05)}}
#rbtn:active{transform:scale(.94)}
#rbtn:focus-visible,#topbar:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ---------- all clear ---------- */
#allclear{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:calc(20px + env(safe-area-inset-top)) 20px calc(80px + env(safe-area-inset-bottom));
  background:var(--bg);opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s;overflow:hidden}
#app.allclear #allclear{opacity:1;visibility:visible;transition:opacity .45s ease}
#rain{position:absolute;inset:0;pointer-events:none}
#rain i{position:absolute;top:-70px;display:block;background:center/contain no-repeat;animation:rain linear infinite;opacity:.95}
@keyframes rain{from{transform:translateY(0) rotate(0)}to{transform:translateY(calc(100vh + 140px)) rotate(var(--spin,360deg))}}
#acTitle{position:relative;font-family:'Bowlby One',sans-serif;font-weight:400;color:var(--cream);font-size:min(120px,19vw);line-height:1;text-align:center;white-space:nowrap;
  filter:drop-shadow(0 20px 20px var(--glow))}
#acTitle span{display:block}
#acCard{position:relative;width:min(320px,100%);padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px;
  opacity:0;transform:translateY(40px) scale(.9);transition:transform .6s var(--spring) .15s,opacity .3s ease .15s;filter:drop-shadow(0 20px 20px var(--glow))}
#app.allclear #acCard{opacity:1;transform:none}
.acRow{display:flex;align-items:center;justify-content:space-between}
.acRow .lv{gap:2px}
.acRow .st{display:flex;gap:4px}
.acRow .st svg{width:18px;height:18px;transform:scale(0)}
.acRow .st svg.off path{fill:var(--track)}
#app.allclear .acRow .st svg{animation:starIn .5s var(--spring) both}
.acTotal{display:flex;justify-content:space-between;padding-top:12px;border-top:2px solid var(--track);font-weight:900;font-size:16px;letter-spacing:-.32px}
#acBtn{position:relative;background:var(--green);padding:16px;border-radius:28px;font-weight:700;font-size:16px;line-height:18px;letter-spacing:-.32px;color:var(--ink);white-space:nowrap;
  opacity:0;transform:translateY(20px) scale(.85);transition:transform .5s var(--spring) .45s,opacity .3s ease .45s}
#app.allclear #acBtn{opacity:1;transform:none}
#app.allclear #acBtn:active{transform:scale(.94);transition-delay:0s}
#acBtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (min-aspect-ratio:1/1){
  #acTitle{font-size:min(120px,11vw,17vh)}
  #acTitle span{display:inline}
  #acTitle span+span{margin-left:.3em}
  #allclear{gap:22px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app" class="title fontwait">
  <div id="field">
    <div id="flames"></div>
    <div id="pan">
      <svg class="ps-neck" viewBox="0 0 270 371" aria-hidden="true"><path d="M108 250 L112 267 Q120 268 120 276 L120 290 L150 290 L150 276 Q150 268 158 267 L162 250 Z"/></svg><div class="ps-grip"></div><div class="ps-rim"></div>
      <svg class="neck" viewBox="0 0 270 371" aria-hidden="true"><path d="M108 250 L112 267 Q120 268 120 276 L120 290 L150 290 L150 276 Q150 268 158 267 L162 250 Z"/></svg><div class="grip"></div>
      <div class="rim"></div>
      <div class="inner"></div>
      <div id="items"></div>
    </div>
  </div>

  <div id="hud">
    <div id="topbar" class="card" role="button" tabindex="0" aria-label="Change level" title="Tap to change level">
      <div class="lv" id="lv"><svg viewBox="0 0 14.2656 14.2656"><path d="M6.4309 0.416127C6.73435 -0.138709 7.53122 -0.138709 7.83467 0.416126L9.84878 4.09878C9.92219 4.23301 10.0326 4.34338 10.1668 4.41679L13.8494 6.4309C14.4043 6.73435 14.4043 7.53122 13.8494 7.83467L10.1668 9.84878C10.0326 9.92219 9.92219 10.0326 9.84878 10.1668L7.83467 13.8494C7.53122 14.4043 6.73435 14.4043 6.4309 13.8494L4.41679 10.1668C4.34338 10.0326 4.23301 9.92219 4.09878 9.84878L0.416127 7.83467C-0.138709 7.53122 -0.138709 6.73435 0.416126 6.4309L4.09878 4.41679C4.23301 4.34338 4.34338 4.23301 4.41679 4.09878L6.4309 0.416127Z" fill="#2AE420"/></svg><span id="lvText">Lv.1</span></div>
      <div id="count">0/20</div>
    </div>
    <div id="stats">
      <div class="stat card" id="sHeat"><div class="k" data-t="heat"></div><div class="v"></div><div class="bar heat"><i></i></div></div>
      <div class="stat card" id="sShake"><div class="k" data-t="shake"></div><div class="v"></div><div class="bar shake"><i></i><b></b></div></div>
      <div class="stat card" id="sBurn"><div class="k" data-t="burn"></div><div class="v"></div><div class="bar burn"><i></i></div></div>
    </div>
  </div>

  <div id="timer">30s</div>
  <div id="msg"><span></span></div>

  <div id="title">
    <h1 id="logo"><span class="w"><span class="c">P</span><span class="c">O</span><span class="c">P</span></span><span class="w"><span class="c">P</span><span class="c">A</span><span class="c">N</span></span></h1>
    <div id="hint"></div>
  </div>

  <div id="allclear">
    <div id="rain"></div>
    <h2 id="acTitle"><span>ALL</span><span>CLEAR!</span></h2>
    <div id="acCard" class="card"></div>
    <button id="acBtn">Play Again</button>
  </div>

  <div id="modal">
    <div id="card" class="card">
      <div id="rtitle" class="display"></div>
      <div id="stars"></div>
      <button id="rbtn"></button>
    </div>
  </div>
</div>

<button id="sound" aria-label="Sound on" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5z" fill="currentColor"/><g class="w"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="x"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg></button>

<script>
(() => {
'use strict';

/* ---------- phases ---------- */

// "Ready?" -> "Go!" -> cooking starts on its own

/* ---------- simulation ---------- */
function update(dt) {

    if (lv.move) {
      st.burner.x = HOME.x + lv.move * Math.sin(0.9 * st.t) + (st.lv === 4 ? lv.move * 0.25 * Math.sin(2.3 * st.t) : 0);
      st.burner.y = HOME.y + lv.move * 0.45 * Math.cos(0.7 * st.t);
    }
    const d = Math.hypot(st.pan.x - st.burner.x, st.pan.y - st.burner.y);

    if (st.scorch >= 100) return finish('burnt');
    if (lv.n - st.spilled < target) return finish('spilled');
    if (st.popped >= lv.n) return finish(inPan >= target ? 'clear' : 'spilled');

  st.panVel.x = pvx;
  st.frameDx = 0;

  sfx.sizzle(st.phase === 'cooking' ? st.hf * (0.6 + 0.4 * st.shake) : 0);
  simItems(dt, dvx, motion.kx * 40, motion.ky * 40);
  motion.kx = motion.ky = 0;
}

function simItems(dt, dvx, kx = 0, ky = 0) {
  const lv = LEVELS[st.lv];
  const cooking = st.phase === 'cooking';
  const shake = st.shake;
  const items = st.items;
  const damp = Math.exp(-3.2 * dt);
  for (const it of items) {
    if (it.gone) continue;
    if (it.spill) {
      it.spill += dt;
      it.x += it.vx * dt; it.y += it.vy * dt;
      it.vz -= 900 * dt; it.z += it.vz * dt;
      if (it.spill > 0.08 && !it.faded) { it.faded = true; it.el.style.opacity = 0; }
      if (it.spill > 0.8) { it.gone = true; it.el.remove(); }
      continue;
    }
    // slosh with pan motion + random agitation from shaking
    it.vx -= Math.max(-400, Math.min(400, dvx)) * 0.55 + kx;
    it.vy -= ky;
    if (cooking && shake > 0.05) {
      it.vx += (Math.random() - 0.5) * 900 * shake * dt;
      it.vy += (Math.random() - 0.5) * 900 * shake * dt;
    }
    it.vx *= damp; it.vy *= damp;
    it.x += it.vx * dt; it.y += it.vy * dt;

    // hop
    if (it.z > 0 || it.vz > 0) {
      it.vz -= 900 * dt; it.z += it.vz * dt;
      if (it.z <= 0) { it.z = 0; it.vz = 0; }
    } else if (cooking && it.popped && shake >= 0.3 && Math.random() < shake * 2.2 * dt) {
      it.vz = 110 + shake * 170;
      if (lv.spill && shake > 0.85 && Math.random() < lv.spill) spillItem(it);
    }

    // keep inside pan
    const lim = PAN_R - it.r;
    const dist = Math.hypot(it.x, it.y);
    if (dist > lim) {
      const nx = it.x / dist, ny = it.y / dist;
      it.x = nx * lim; it.y = ny * lim;
      const vn = it.vx * nx + it.vy * ny;
      if (vn > 0) { it.vx -= 1.5 * vn * nx; it.vy -= 1.5 * vn * ny; }
    }
  }
  // soft separation
  for (let i = 0; i < items.length; i++) {
    const a = items[i]; if (a.gone || a.spill) continue;
    for (let j = i + 1; j < items.length; j++) {
      const b = items[j]; if (b.gone || b.spill) continue;
      const dx = b.x - a.x, dy = b.y - a.y, min = (a.r + b.r) * 0.85;
      const d2 = dx * dx + dy * dy;
      if (d2 < min * min && d2 > 1e-4) {
        const d = Math.sqrt(d2), push = (min - d) * 0.25 / d;
        a.x -= dx * push; a.y -= dy * push; b.x += dx * push; b.y += dy * push;
      }
    }
  }
}

/* ---------- render ---------- */
const ease = t => 1 - Math.pow(1 - t, 3);
function render(dt) {
  // pan position (glide from title to game spot)
  let p = toScreen(st.pan), pk = L.k;
  if (st.phase === 'title' || st.introT > 0) {
    const bob = Math.sin(performance.now() / 600) * 6;
    const tp = { x: L.cx, y: L.titleY + bob };
    if (st.introT > 0) {
      st.introT = Math.min(1, st.introT + dt / 0.75);
      const e = ease(st.introT);
      p = { x: tp.x + (p.x - tp.x) * e, y: tp.y + (p.y - tp.y) * e };
      pk = L.tk + (L.k - L.tk) * e;
      if (st.introT >= 1) st.introT = 0;
    } else { p = tp; pk = L.tk; }
  }
  const f = Math.min(1, dt * 18);
  motion.jx += (motion.tx - motion.jx) * f; motion.jy += (motion.ty - motion.jy) * f;
  motion.tx *= Math.exp(-6 * dt); motion.ty *= Math.exp(-6 * dt);
  if (st.phase !== 'title') { p.x += motion.jx; p.y += motion.jy; }
  panEl.style.transform = `translate(${p.x - 135}px, ${p.y - 135}px) rotate(${st.tilt.toFixed(2)}deg) scale(${pk})`;
  const b = toScreen(st.burner);
  flamesEl.style.transform = `translate(${b.x}px, ${b.y}px) scale(${L.k})`;
  panFloor.style.setProperty('--heat', (st.hf * 0.95).toFixed(3));
  itemsEl.style.setProperty('--burn', (st.scorch / 100).toFixed(3));

  const shake = st.phase === 'cooking' ? st.shake : 0;
  for (const it of st.items) {
    if (it.gone) continue;
    let jx = 0, jy = 0;
    if (!it.popped) {
      const ratio = Math.min(1, it.heat / it.thr);
      const amp = shake * 1.2 + (ratio > 0.8 ? 1.4 : 0);
      if (amp > 0.05) { jx = (Math.random() - 0.5) * amp * 2; jy = (Math.random() - 0.5) * amp * 2; }
      if (Math.abs(ratio - it.h) > 0.03) {
        it.h = ratio;
        it.el.style.filter = `brightness(${(1 - 0.22 * ratio).toFixed(3)}) saturate(${(1 + 0.25 * ratio).toFixed(3)})`;
      }
    }
    const s = it.popped ? (1 + Math.max(0, it.z) / 220) : it.scale * (1 + it.z / 220);
    it.el.style.transform = `translate(${(135 + it.x + jx).toFixed(2)}px, ${(135 + it.y + jy - it.z).toFixed(2)}px) translate(-50%,-50%) rotate(${it.rot.toFixed(1)}deg) scale(${s.toFixed(3)})`;
  }
  renderHud();
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render(dt);
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
document.querySelectorAll('#logo .c').forEach((c, i) => c.style.animationDelay = (0.08 + i * 0.07) + 's');
applyText();
goReady(true);
setPhase('title');
layout();
const fontsIn = () => { app.classList.remove('fontwait'); layout(); };
(document.fonts?.ready || Promise.resolve()).then(fontsIn);
setTimeout(fontsIn, 1500);
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
